[package]
name = "ds_core"
version = "0.6.3"
license = "GPL-3.0-only"
edition = "2024"

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
bytes = "1"
dashmap = "6"
fastrand = "2"
futures = "0.3.32"
log = "0.4.29"
pin-project-lite = "0.2.17"
wreq = { version = "5.3.0", default-features = false, features = ["json", "stream", "multipart", "socks", "webpki-roots"] }
wreq-util = "2.2.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["macros", "sync"] }
wasmtime = { version = "48", features = ["cranelift"] }
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
rsa = "0.10.0"
sha2 = "0.11.2"
getrandom = "0.3"
