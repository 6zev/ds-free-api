name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:

  # ── 发布门禁 1：标签 / 版本 / CHANGELOG 一致（秒级，无需前端产物）────
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches Cargo.toml, ds_core and web/package.json
        run: |
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CORE_VERSION=$(grep '^version =' ds_core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          WEB_VERSION=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${{ steps.meta.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          status=0
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "✗ Cargo.toml version=$CARGO_VERSION 与 tag=$TAG_VERSION 不一致"
            status=1
          fi
          if [ "$CORE_VERSION" != "$TAG_VERSION" ]; then
            echo "✗ ds_core/Cargo.toml version=$CORE_VERSION 与 tag=$TAG_VERSION 不一致"
            status=1
          fi
          if [ "$WEB_VERSION" != "$TAG_VERSION" ]; then
            echo "✗ web/package.json version=$WEB_VERSION 与 tag=$TAG_VERSION 不一致"
            status=1
          fi
          # CHANGELOG 必须存在对应条目，否则 release notes 会为空
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "✗ CHANGELOG.md 缺少 [$TAG_VERSION] 条目"
            status=1
          fi
          exit $status

  # ── 发布门禁 2：在打标签的提交上跑全量测试 ─────────────────────────
  #
  # 必须先拿到 web-dist：`rust_embed` 的 `#[folder = "web/dist/"]` 在目录缺失时
  # 会静默生成一个空的嵌入资源（`WebAssets::get` 直接不存在），
  # 于是发布二进制会丢失整个管理面板。因此这里显式下载前端产物后再编译。
  test:
    needs: [verify, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libclang-dev
      - name: Verify the admin panel is actually embedded
        run: |
          test -f web/dist/index.html || {
            echo "✗ web/dist/index.html 缺失，发布二进制将不含管理面板"
            exit 1
          }
      - name: Run full test suite against the tagged commit
        run: cargo test --workspace --all-targets

  build-frontend:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Build frontend
        run: bun run build
        working-directory: web
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
  build-linux-gnu:
    needs: [build-frontend, test]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install build dependencies (aarch64)
        if: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config g++
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="ds-free-api-${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/ds-free-api" "$name/"
          cp LICENSE README.md README.en.md config.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: "*.tar.gz"
          if-no-files-found: error

  # ── Linux musl（静态链接，scratch / Alpine 可直接运行）──────────────
  #
  # 为什么不用 `*-linux-musl-g++` 交叉工具链：
  #   `wreq` → `boring2` → `boring-sys2` 是 build-dependency，永远按 **host** 编译，
  #   bindgen 跑在 runner 的 glibc 上；交叉构建时 bindgen 必须解析目标 C 库头文件
  #   （musl 的 stdint.h + bits/），而 musl.cc 工具链的 sysroot 对 clang 不友好
  #   （找不到 libc-header-start.h），v0.6.0 的 aarch64-musl 就死在
  #   `unable to generate bindings`，x86_64-musl 仅因 fail-fast 被取消。
  #
  # 改为原生 runner 构建：x86_64 用 ubuntu-latest，aarch64 用 ubuntu-24.04-arm，
  # host == target，保持 bindgen 原生模式；C/C++ 侧用 zig 的 musl 驱动
  # （`aarch64-linux-musl-gcc` 等价物），Rust 侧 `-C target-feature=+crt-static` 静态链接。
  build-linux-musl:
    needs: [build-frontend, test]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            suffix: linux-x86_64-musl
            runner: ubuntu-latest
            zig_target: x86_64-linux-musl
            zig_arch: x86_64
          - target: aarch64-unknown-linux-musl
            suffix: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
            zig_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake g++ libclang-dev perl pkg-config
      - name: Install zig (musl C/C++ driver)
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          url="https://ziglang.org/download/0.13.0/zig-linux-${ZIG_ARCH}-0.13.0.tar.xz"
          curl -sSL "$url" | tar xJ -C /opt
          /opt/zig-linux-${ZIG_ARCH}-0.13.0/zig version
          # cc-rs 会自动追加 `--target=<rust triple>`，zig 不认识 Rust 的 triple
          # （`x86_64-unknown-linux-musl` → UnknownOperatingSystem）。wrapper 把
          # `-target` 固定在前面，并丢掉调用方传入的重复 target 参数。
          #
          # 链接不能交给 zig cc：zig 0.13 即使收到 `-nostdlib/-nostartfiles` 也会
          # 强行塞入自己的 musl crt1.o/crti.o，与 rustc 从 self-contained 传入的
          # 启动文件撞成 `duplicate symbol: _start/_init/_fini`。因此：
          #   编译/预处理 → zig cc（正确 target、正确头文件）
          #   链接       → rustc 自带的 lld（GNU 风味），启动文件/libc.a 完全由
          #               rustc 传入的 .o/.a 决定；gcc 驱动层专有参数在此翻译/剥除：
          #        · -m64/-nostartfiles/-nodefaultlibs → 丢弃（lld 无对应概念）
          #        · -static-pie  → `-static -pie`（否则 rcrt1.o + 非 PIE 会崩溃）
          #        · -Wl,a,b      → `a b`
          #        · -lstdc++     → 丢弃（BoringSSL 无任何 libc++/libstdc++ 引用，
          #                          boring-sys 只是无条件追加了它）
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/gcc-ld/ld.lld"
          test -x "$RUST_LLD"
          echo "RUST_LLD=$RUST_LLD" >> "$GITHUB_ENV"
          mkdir -p /opt/musl-cc
          for mode in cc c++; do
            wrapper="/opt/musl-cc/${ZIG_ARCH}-linux-musl-${mode}"
            sed 's/^          //' > "$wrapper" <<'WRAP'
          #!/bin/sh
          set -e
          # 丢弃调用方传入的 --target=… / -target <val>：cc-rs 会追加 Rust triple，
          # zig 不认识它（UnknownOperatingSystem）。target 由本脚本固定。
          compile_only="no"
          clean=""
          skip_next=""
          for a in "$@"; do
            if [ -n "$skip_next" ]; then skip_next=""; continue; fi
            case "$a" in
              --target=*) continue ;;
              -target) skip_next=1; continue ;;
              -c|-E|-S|-M|-MM|-fsyntax-only) compile_only="yes" ;;
            esac
            clean="$clean
          $a"
          done
          if [ "$compile_only" = "yes" ]; then
            exec __ZIG__ __MODE__ -target __TRIPLE__ $(printf '%s\n' "$clean" | tail -n +2)
          fi
          # ---- 链接：把 rustc 的 gcc 风格参数翻译成 lld 能吃的 ----
          lld_args=""
          need_val=""
          for a in "$@"; do
            if [ -n "$need_val" ]; then
              need_val=""
              case "$prev" in
                -o) lld_args="$lld_args -o $a" ;;
                -L) lld_args="$lld_args -L$a" ;;
                -l) lld_args="$lld_args -l$a" ;;
                -isystem|-I|-D|-U|-MF|-MT|-MQ) ;;
              esac
              continue
            fi
            case "$a" in
              --target=*|-m64|-m32|-march=*|-mtune=*|-mcmodel=*) continue ;;
              -nostartfiles|-nodefaultlibs|-nostdlib|-static-libgcc) continue ;;
              -pthread|-shared|-rdynamic|-fsyntax-only|-c|-E|-S) continue ;;
              -lstdc++|-lc++|-lc++abi|-lsupc++) continue ;;
              -static-pie) lld_args="$lld_args -static -pie" ;;
              -static) lld_args="$lld_args -static" ;;
              -pie) lld_args="$lld_args -pie" ;;
              -o|-L|-l|-isystem|-I|-D|-U|-MF|-MT|-MQ) prev="$a"; need_val=1; continue ;;
              -Wl,*) lld_args="$lld_args $(printf '%s' "${a#-Wl,}" | tr ',' ' ')" ;;
              -Wl*)  lld_args="$lld_args $(printf '%s' "${a#-Wl}" | tr ',' ' ')" ;;
              *) lld_args="$lld_args $a" ;;
            esac
          done
          # GNU 驱动按 -m elf_<arch> 选择目标格式
          exec __LLD__ -m __EMU__ $lld_args
          WRAP
            sed -i "s#__ZIG__#/opt/zig-linux-${ZIG_ARCH}-0.13.0/zig#; s#__MODE__#${mode}#; s#__TRIPLE__#${ZIG_TARGET}#; s#__LLD__#$RUST_LLD#; s#__EMU__#elf_${ZIG_ARCH}#" "$wrapper"
          done
          printf '#!/bin/sh\nexec /opt/zig-linux-%s-0.13.0/zig ar "$@"\n' "${ZIG_ARCH}" > /opt/musl-cc/${ZIG_ARCH}-linux-musl-ar
          chmod +x /opt/musl-cc/*
          # `wreq` 的 build-dep `boring-sys2` 里 bindgen（host clang）需要目标 C 库头文件。
          # rustup 的 musl `self-contained` 目录只有 .o/libc.a，没有 headers（1.95 已验证），
          # 所以直接用 zig 自带的 musl 头文件树。它同时含 CC 编译所需的一切，绑定时
          # 也不影响真正的 C 编译（那些仍走 wrapper → zig cc）。
          ZIG_INC="/opt/zig-linux-${ZIG_ARCH}-0.13.0/lib/libc/include"
          ARCH_INC="${ZIG_TARGET}"
          test -f "$ZIG_INC/generic-musl/stddef.h"
          test -f "$ZIG_INC/$ARCH_INC/bits/alltypes.h"
          MUSL_INC="-isystem $ZIG_INC/generic-musl -isystem $ZIG_INC/$ARCH_INC"
          echo "MUSL_INC=${MUSL_INC}" >> "$GITHUB_ENV"
          {
            echo "CFLAGS_x86_64_unknown_linux_musl=$MUSL_INC"
            echo "CXXFLAGS_x86_64_unknown_linux_musl=$MUSL_INC"
            echo "CFLAGS_aarch64_unknown_linux_musl=$MUSL_INC"
            echo "CXXFLAGS_aarch64_unknown_linux_musl=$MUSL_INC"
            # bindgen 会按 TARGET 查询 BINDGEN_EXTRA_CLANG_ARGS_<triple>，逐 target 写入
            echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_linux_musl=$MUSL_INC"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_musl=$MUSL_INC"
          } >> "$GITHUB_ENV"
          echo "/opt/musl-cc" >> "$GITHUB_PATH"
          cat /opt/musl-cc/${ZIG_ARCH}-linux-musl-cc
      - name: Build
        run: |
          export CC_x86_64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-cc"
          export CXX_x86_64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-c++"
          export AR_x86_64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-ar"
          export CC_aarch64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-cc"
          export CXX_aarch64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-c++"
          export AR_aarch64_unknown_linux_musl="${{ matrix.zig_arch }}-linux-musl-ar"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="${{ matrix.zig_arch }}-linux-musl-cc"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${{ matrix.zig_arch }}-linux-musl-cc"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify static linkage
        run: |
          ldd "target/${{ matrix.target }}/release/ds-free-api" && exit 1 || true
          "target/${{ matrix.target }}/release/ds-free-api" --version || true
      - name: Package
        run: |
          name="ds-free-api-${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/ds-free-api" "$name/"
          cp LICENSE README.md README.en.md config.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: "*.tar.gz"
          if-no-files-found: error

  build-macos:
    needs: [build-frontend, test]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            suffix: macos-aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install dependencies
        run: |
          brew update
          brew install --formula cmake pkg-config llvm
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="ds-free-api-${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/ds-free-api" "$name/"
          cp LICENSE README.md README.en.md config.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: "*.tar.gz"
          if-no-files-found: error

  build-windows:
    needs: [build-frontend, test]
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - target: aarch64-pc-windows-msvc
            suffix: windows-aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ github.event.inputs.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install dependencies
        shell: cmd
        run: |
          choco install cmake -y
          choco install strawberryperl -y
          choco install pkgconfiglite -y
          choco install llvm -y
          choco install nasm -y
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $name = "ds-free-api-${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path $name
          Copy-Item "target/${{ matrix.target }}/release/ds-free-api.exe" "$name/"
          Copy-Item LICENSE, README.md, README.en.md, config.example.toml "$name/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: "*.zip"
          if-no-files-found: error

  docker:
    needs: [build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Extract binaries to Docker build context
        run: |
          mkdir -p target/docker/amd64 target/docker/arm64
          tar xzf dist/linux-x86_64-musl/*.tar.gz -C target/docker/amd64 --strip-components=1
          tar xzf dist/linux-aarch64-musl/*.tar.gz -C target/docker/arm64 --strip-components=1

      - name: Lowercase owner for Docker tag
        id: docker_meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ steps.docker_meta.outputs.owner }}/ds-free-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.docker_meta.outputs.owner }}/ds-free-api:latest

  release:
    needs: [verify, test, build-linux-gnu, build-linux-musl, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${TAG#v}"
          awk "/## \[$VERSION\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION"
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          # 只取平台产物。不要下载全部 artifact：docker 任务的 BuildKit GHA 缓存
          # 会以 `NIyueeE~ds-free-api~<hash>.dockerbuild` 形式出现在同一次运行的
          # artifact 列表里，全量下载会让下面的 flatten 步骤因为「用文件覆盖目录」而失败。
          pattern: "{linux-*,macos-*,windows-*}"

      - name: Flatten structure
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist/ {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > ../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # 显式指定 tag：workflow_dispatch 触发时 github.ref_name 是分支名，不是 tag
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-pre') }}
          files: dist/*
          generate_release_notes: false
          body_path: release_notes.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
